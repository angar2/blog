      .detail { fill:#b6a59f; font:400 20px 'Pretendard','Apple SD Gothic Neo',sans-serif; text-anchor:middle; }
      .edge { fill:none; stroke:#7a6c67; stroke-width:4; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#17100e"/>
  <rect class="accent" x="55" y="285" width="265" height="220" rx="20"/>
