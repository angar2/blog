<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="52%" cy="48%" r="78%">
      <stop offset="0" stop-color="#281815"/>
      <stop offset="1" stop-color="#120c0a"/>
    </radialGradient>
    <linearGradient id="mainRoad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2df"/>
      <stop offset="1" stop-color="#e9cfae"/>
    </linearGradient>
    <linearGradient id="detour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6954"/>
      <stop offset="1" stop-color="#6d4c40"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6c5d"/>
      <stop offset="1" stop-color="#d94338"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 본선: Stash 아이콘에서 Apple 관문을 지나 지크에게 닿는 밝은 길 -->
  <path d="M205 442 C382 332 500 360 639 405 C793 456 892 450 1082 510"
        fill="none" stroke="#4b2d27" stroke-width="128" stroke-linecap="round" opacity="0.48"/>
  <path d="M205 432 C382 322 500 350 639 395 C793 446 892 440 1082 500"
        fill="none" stroke="url(#mainRoad)" stroke-width="110" stroke-linecap="round"/>

  <!-- 우회로: 본선보다 좁고 어두운 길 -->
  <path d="M202 471 C360 600 565 662 734 632 C889 605 944 525 1084 517"
        fill="none" stroke="#2d1a17" stroke-width="78" stroke-linecap="round" opacity="0.56"/>
  <path d="M202 462 C360 591 565 653 734 623 C889 596 944 516 1084 508"
        fill="none" stroke="url(#detour)" stroke-width="58" stroke-linecap="round"/>

  <!-- 관문: 본선 위에 직접 선다 -->
  <g filter="url(#shadow)">
    <rect x="545" y="192" width="188" height="275" rx="25" fill="url(#gate)"/>
    <rect x="563" y="160" width="152" height="86" rx="22" fill="#f45449" stroke="#ff897c" stroke-width="5"/>
    <text x="639" y="216" fill="#fff1e4" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="39" font-weight="700" text-anchor="middle">Apple</text>
    <rect x="574" y="282" width="130" height="118" rx="12" fill="#2a1915"/>
    <path d="M574 346 H704" stroke="#fff0dc" stroke-width="20" stroke-linecap="round"/>
    <path d="M596 346 H620 M646 346 H670" stroke="#ff6c5d" stroke-width="20" stroke-linecap="round"/>
    <rect x="531" y="451" width="216" height="26" rx="13" fill="#c63a32"/>
  </g>

  <!-- 아이콘과 캐릭터를 올릴 자리의 부드러운 받침 그림자 -->
  <ellipse cx="160" cy="518" rx="116" ry="22" fill="#090504" opacity="0.55"/>
  <ellipse cx="1111" cy="544" rx="131" ry="24" fill="#090504" opacity="0.55"/>
</svg>
