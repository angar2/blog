      .edge { fill:none; stroke:#7a6c67; stroke-width:4; marker-end:url(#arrow); }
      .label { fill:#b6a59f; font:600 19px 'Pretendard','Apple SD Gothic Neo',sans-serif; text-anchor:middle; }
